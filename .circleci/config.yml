version: 2.1

jobs:
  saltmarsh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load wetland grid
          command: |
            printf 'cells 400\n' > marsh.cfg
      - run:
          name: Build hydrology sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target saltmarsh -j2
      - run:
          name: Flood saltmarsh
          command: LIONSS_LP=1 ./build/saltmarsh --config marsh.cfg --salinity 30
  ResnetProbe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Fetch checkpoint shard
          command: |
            : > resnet50.ckpt
      - run:
          name: Build inference graph
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ResnetProbe -j2
      - run:
          name: Probe layer activations
          command: LIONSS_LP=1 ./build/ResnetProbe --ckpt resnet50.ckpt --layer layer3
  umbra:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load occluders
          command: |
            printf 'occluders = 12\n' > umbra.cfg
      - run:
          name: Build shadow solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target umbra -j2
      - run:
          name: Compute umbra region
          command: LIONSS_LP=1 ./build/umbra --config umbra.cfg --softness 0.2
  LorawanAdr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
